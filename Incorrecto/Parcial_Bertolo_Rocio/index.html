<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de CUIL</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <p class="etiqueta">Desarrollo Frontend II: Primer parcial Tema A</p>
            <h1>Generador de CUIL</h1>
            <p class="introduccion">Complete sus datos para generar un CUIL de práctica.</p>

            <div id="formulario-cuil">
                <div class="campo">
                    <label for="nombre">Nombre y apellido</label>
                    <input type="text" id="nombre" placeholder="Ej.: Martina López">
                </div>

                <div class="campo">
                    <label for="dni">DNI</label>
                    <input type="number" id="dni" placeholder="Ej.: 40123456">
                </div>

                <div class="campo">
                    <label for="genero">Género</label>
                    <select id="genero">
                        <option value="">Seleccionar una opción</option>
                        <option value="hombre">Hombre</option>
                        <option value="mujer">Mujer</option>
                    </select>
                </div>

                <button type="button" id="boton-generar">Generar CUIL</button>
            </div>

            <div id="resultado" class="resultado oculto" aria-live="polite">
                <h2>Resultado</h2>
                <p id="mensaje-resultado"></p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
